<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cross-Stitch Pattern Maker</title>
  <!-- An empty icon stops the browser from requesting /favicon.ico (absolute path, breaks on a sub-path). -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/print.css" media="print">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 class="app-header__title">Cross-Stitch Pattern Maker</h1>
    <label class="file-picker">
      <span class="file-picker__label">Choose image</span>
      <input class="file-picker__input" type="file" accept="image/*" data-role="file-input">
    </label>
  </header>

  <main class="app-main">
    <form class="settings collapsible" data-role="settings" novalidate>
      <!-- On phones the fields fold behind this button; on wider screens it is hidden (styles/main.css). -->
      <button class="collapsible__toggle" type="button" data-action="toggle-settings"
              aria-expanded="false" aria-controls="settings-body">
        <span class="collapsible__title">Settings</span>
        <span class="collapsible__summary" data-role="settings-summary">Width 100 · max 24 colors · 14 ct</span>
      </button>

      <div class="collapsible__body settings__body" id="settings-body">
      <fieldset class="settings__group">
        <legend class="settings__legend">Pattern settings</legend>

        <div class="settings__field">
          <label class="settings__label" for="setting-target-width">Width (stitches)</label>
          <input class="settings__input" id="setting-target-width" type="number" min="10" max="10000" step="1" value="100"
                 inputmode="numeric" data-setting="targetWidth" aria-describedby="setting-target-width-error">
          <span class="settings__error" id="setting-target-width-error" data-error-for="targetWidth" hidden></span>
        </div>

        <div class="settings__field">
          <label class="settings__label" for="setting-max-colors">Max colors</label>
          <input class="settings__input" id="setting-max-colors" type="number" min="1" max="489" step="1" value="24"
                 inputmode="numeric" data-setting="maxColors" aria-describedby="setting-max-colors-error">
          <span class="settings__error" id="setting-max-colors-error" data-error-for="maxColors" hidden></span>
        </div>

        <div class="settings__field">
          <label class="settings__label" for="setting-fabric-count">Fabric (Aida count)</label>
          <select class="settings__input" id="setting-fabric-count" data-setting="fabricCount">
            <option value="11">11 ct</option>
            <option value="14" selected>14 ct</option>
            <option value="16">16 ct</option>
            <option value="18">18 ct</option>
          </select>
        </div>
      </fieldset>

      <output class="settings__size" data-role="pattern-size">Load an image to see the pattern size.</output>
      </div>

      <output class="settings__status" data-role="generation-status" aria-live="polite"></output>
      <button class="settings__button" type="button" data-action="generate" hidden>Generate</button>
      <button class="settings__button" type="button" data-action="stop-generation" hidden>Stop</button>
    </form>

    <section class="workspace" data-role="workspace" aria-label="Pattern view">
      <div class="toolbar">
        <fieldset class="layer-switcher" data-role="layer-switcher">
          <legend class="layer-switcher__legend">View</legend>
          <label class="layer-switcher__option">
            <input class="layer-switcher__input" type="radio" name="layer" value="original" checked>
            <span class="layer-switcher__text">Original</span>
          </label>
          <label class="layer-switcher__option">
            <input class="layer-switcher__input" type="radio" name="layer" value="dmc" disabled>
            <span class="layer-switcher__text">DMC colors</span>
          </label>
          <label class="layer-switcher__option">
            <input class="layer-switcher__input" type="radio" name="layer" value="chart" disabled>
            <span class="layer-switcher__text">Chart</span>
          </label>
        </fieldset>

        <div class="zoom-controls" role="group" aria-label="Zoom">
          <button class="zoom-controls__button" type="button" data-action="zoom-out" aria-label="Zoom out" disabled>−</button>
          <output class="zoom-controls__level" data-role="zoom-level">—</output>
          <button class="zoom-controls__button" type="button" data-action="zoom-in" aria-label="Zoom in" disabled>+</button>
          <button class="zoom-controls__button" type="button" data-action="zoom-fit" disabled>Fit</button>
        </div>
      </div>

      <div class="viewer" data-role="viewer" tabindex="0" role="application"
           aria-label="Image view. Drag or use the arrow keys to pan, the mouse wheel or + and − to zoom, 0 to fit.">
        <canvas class="viewer__canvas" data-role="viewer-canvas" aria-hidden="true"></canvas>
        <p class="viewer__empty" data-role="viewer-empty">Choose an image or drop it here</p>
      </div>

      <output class="status" data-role="status" aria-live="polite"></output>
    </section>

    <section class="legend collapsible" data-role="legend" aria-labelledby="legend-title" hidden>
      <!-- On phones the rows fold behind this button; on wider screens it is hidden (styles/main.css). -->
      <button class="collapsible__toggle" type="button" data-action="toggle-legend"
              aria-expanded="false" aria-controls="legend-body">
        <span class="collapsible__title">Legend</span>
        <span class="collapsible__summary" data-role="legend-summary"></span>
      </button>
      <h2 class="legend__title" id="legend-title">Legend</h2>
      <div class="collapsible__body legend__body" id="legend-body">
      <p class="legend__empty" data-role="legend-empty" hidden>This pattern has no stitches.</p>
      <table class="legend__table" data-role="legend-table">
        <thead>
          <tr>
            <th class="legend__heading" scope="col">No.</th>
            <th class="legend__heading" scope="col">Color</th>
            <th class="legend__heading" scope="col">DMC</th>
            <th class="legend__heading legend__heading--name" scope="col">Name</th>
            <th class="legend__heading legend__heading--count" scope="col">Stitches</th>
          </tr>
        </thead>
        <tbody data-role="legend-rows"></tbody>
      </table>
      </div>
      <template data-role="legend-row-template">
        <tr class="legend__row">
          <td class="legend__cell"><span class="legend__number" data-field="number"></span></td>
          <td class="legend__cell"><span class="legend__swatch" data-field="swatch" aria-hidden="true"></span></td>
          <td class="legend__cell" data-field="code"></td>
          <td class="legend__cell legend__cell--name" data-field="name"></td>
          <td class="legend__cell legend__cell--count" data-field="stitchCount"></td>
        </tr>
      </template>
    </section>
  </main>
</body>
</html>
